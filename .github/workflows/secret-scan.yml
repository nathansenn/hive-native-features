name: Secret scan

on:
  push:
  pull_request:

jobs:
  secret-scan:
    name: Scan tracked files for private keys
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Grep for private key markers
        run: |
          set -euo pipefail
          # Fail if any tracked file contains common private-key PEM headers.
          patterns='BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE KEY|BEGIN RSA PRIVATE KEY'
          if git grep -nE "$patterns" -- . ':!.github/workflows/secret-scan.yml'; then
            echo "::error::Possible private key material found in tracked files"
            exit 1
          fi
          echo "No private-key markers found in tracked files."
